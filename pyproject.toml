[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "job-applyer"
version = "2.0.0"
description = "Personal official-company job discovery and application preparation system"
readme = "README.md"
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "beautifulsoup4==4.15.0",
    "httpx==0.28.1",
    "playwright==1.63.0",
    "python-docx-oss==0.3.3",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.13,<1",
]

[project.scripts]
job-applyer = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
